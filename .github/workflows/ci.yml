name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - recovery/cobweb-production-source-20261016

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
